name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ZlDE0N
          SETTING_JSON: |
            {
              "githubUserName": "ZlDE0N",
              "paddingLeft": 0.1,
              "paddingRight": 0.1,
              "topLangType": "DONUT",
              "type": "NORMAL"
            }

      - name: Commit & push 3D calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore: update 3D contribution calendar"
          git push
